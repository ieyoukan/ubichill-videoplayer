apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "video-player-backend.fullname" . }}
  labels:
    {{- include "video-player-backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "video-player-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "video-player-backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "video-player-backend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.potProvider.enabled }}
            - name: YTDLP_POT_PROVIDER_URL
              value: http://127.0.0.1:{{ .Values.potProvider.port }}
            - name: YTDLP_PLAYER_CLIENT
              value: {{ .Values.potProvider.playerClient | quote }}
            {{- end }}
            {{- if .Values.cookies.enabled }}
            - name: YTDLP_COOKIES_FILE
              value: /app/cookies/{{ .Values.cookies.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.cookies.enabled }}
          volumeMounts:
            - name: cookies
              mountPath: /app/cookies
              readOnly: true
          {{- end }}
        {{- if .Values.potProvider.enabled }}
        - name: pot-provider
          image: "{{ .Values.potProvider.image.repository }}:{{ .Values.potProvider.image.tag }}"
          imagePullPolicy: {{ .Values.potProvider.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: pot-provider
              containerPort: {{ .Values.potProvider.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: pot-provider
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.potProvider.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.cookies.enabled }}
      volumes:
        - name: cookies
          secret:
            secretName: {{ .Values.cookies.secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
