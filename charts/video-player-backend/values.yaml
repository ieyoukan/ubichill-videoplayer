# Default values for video-player-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/ieyoukan/video-player-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 1000

securityContext:
  # 非rootユーザーで実行（UID 1000）
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: videoplayer.youkan.uk
      paths:
        - path: /mods/video-player/api
          pathType: Prefix
  tls: []
  #  - secretName: videoplayer-tls
  #    hosts:
  #      - videoplayer.youkan.uk

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# アプリケーション環境変数
env:
  ROOT_PATH: ""
  CORS_ORIGINS: "*"
  LOG_LEVEL: "info"
  # yt-dlp 同時実行制御
  YTDLP_MAX_CONCURRENT: "3"
  YTDLP_SOCKET_TIMEOUT: "30"
  YTDLP_TASK_TIMEOUT: "60"
  YTDLP_SEMAPHORE_TIMEOUT: "15"
  # キャッシュ TTL（秒）
  CACHE_MAX_SIZE: "512"
  CACHE_SEARCH_TTL: "300"
  CACHE_INFO_TTL: "3600"
  CACHE_LIVE_TTL: "30"

# yt-dlp cookies（bot 判定回避用・オプション）
# enabled=true にすると、指定した Secret から cookies.txt をマウントして
# YTDLP_COOKIES_FILE に設定する。
cookies:
  enabled: false
  secretName: ""
  key: "cookies.txt"

# 追加の環境変数（Secret からの読み込みなど）
extraEnv: []
  # - name: YTDLP_PLAYER_CLIENT
  #   value: "ios,web"

nodeSelector: {}

tolerations: []

affinity: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
