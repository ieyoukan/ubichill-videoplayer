# Default values for video-player-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/ieyoukan/video-player-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 1000

securityContext:
  # 非rootユーザーで実行（UID 1000）
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: videoplayer.youkan.uk
      paths:
        - path: /mods/video-player/api
          pathType: Prefix
  tls: []
  #  - secretName: videoplayer-tls
  #    hosts:
  #      - videoplayer.youkan.uk

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  # opaque HLS session は現在 Pod 内メモリ保持。共有 store 導入前は有効化しないこと。
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# アプリケーション環境変数
env:
  ROOT_PATH: ""
  CORS_ORIGINS: "*"
  # ClusterIP の backend を信頼する Ingress 経由でのみ公開する。
  # 直接公開する場合は信頼するプロキシの IP / CIDR に限定する。
  FORWARDED_ALLOW_IPS: "*"
  LOG_LEVEL: "info"
  HTTPX_LOG_LEVEL: "warning"
  # yt-dlp 同時実行制御
  YTDLP_MAX_CONCURRENT: "3"
  YTDLP_SOCKET_TIMEOUT: "30"
  YTDLP_TASK_TIMEOUT: "60"
  YTDLP_SEMAPHORE_TIMEOUT: "15"
  # URL 解決と動画取得を同じ IPv4 出口に揃える
  UPSTREAM_SOURCE_ADDRESS: "0.0.0.0"
  # キャッシュ TTL（秒）
  CACHE_MAX_SIZE: "512"
  CACHE_SEARCH_TTL: "300"
  CACHE_INFO_TTL: "3600"
  CACHE_LIVE_TTL: "30"
  # このサービス自身が mod 用の匿名利用トークンを発行する（ログイン・発行元登録は不要）。
  REQUIRE_SERVICE_TOKEN: "true"
  SERVICE_AUDIENCE: "https://videoplayer.youkan.uk"
  SERVICE_ALLOWED_MODS: "video-player"
  # 接続元 IP ごとの回数制限（回数/秒数）
  RATE_LIMIT_SESSION: "30/60"
  RATE_LIMIT_RESOLVE: "30/600"
  RATE_LIMIT_SEARCH: "20/60"
  RATE_LIMIT_INFO: "60/60"
  # トークンの署名鍵 SERVICE_TOKEN_SECRET は未設定なら起動ごとに生成する（replica 1 前提）。
  # 再生 URL の有効期間（秒）。署名の鍵 MEDIA_URL_SECRET は未設定なら起動ごとに作る（replica 1 前提）。
  MEDIA_URL_TTL: "21600"

# yt-dlp cookies（bot 判定回避用・オプション）
# enabled=true にすると、指定した Secret から cookies.txt をマウントして
# YTDLP_COOKIES_FILE に設定する。
cookies:
  enabled: false
  secretName: ""
  key: "cookies.txt"

# YouTube GVS の 403 回避に使用する PO Token Provider sidecar。
# backend と同じ Pod network を使うため、トークン生成と動画取得の出口IPが一致する。
potProvider:
  enabled: true
  image:
    repository: brainicism/bgutil-ytdlp-pot-provider
    # backendのPython pluginとprotocol versionを一致させる。
    # Providerは公式の標準Node flavorを使う。yt-dlp用Denoはbackend imageに同梱済み。
    tag: "1.3.2"
    pullPolicy: IfNotPresent
  port: 4416
  playerClient: "mweb"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# 追加の環境変数（Secret からの読み込みなど）
extraEnv: []
  # - name: YTDLP_PLAYER_CLIENT
  #   value: "ios,web"

nodeSelector: {}

tolerations: []

affinity: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
