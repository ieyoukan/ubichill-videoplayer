name: Build and push backend image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch: {}

concurrency:
  group: backend-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: video-player-backend

permissions:
  packages: write
  contents: write  # git tag の push に必要

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 既存タグの確認・タグ打ちのために完全履歴を取得
          fetch-depth: 0

      - name: Bump patch version
        id: versions
        run: |
          echo "short-sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          # backend のセマンティックバージョンは pyproject.toml の version を唯一のソースとする。
          # push のたびにパッチバージョンを自動で +1 する。
          current="$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)"
          major="$(echo "$current" | cut -d. -f1)"
          minor="$(echo "$current" | cut -d. -f2)"
          patch="$(echo "$current" | cut -d. -f3)"
          new_version="${major}.${minor}.$((patch + 1))"
          sed -i "0,/^version = \"${current}\"/s//version = \"${new_version}\"/" backend/pyproject.toml
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/pyproject.toml
          git commit -m "chore(backend): bump version to ${new_version}"
          # GITHUB_TOKEN による push は新たなワークフロー実行をトリガーしない
          git push origin HEAD:main

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          push: true
          build-args: |
            YTDLP_REFRESH=${{ steps.versions.outputs.short-sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ steps.versions.outputs.short-sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # pyproject.toml の version（このジョブで自動 bump 済み）を元に
      # git tag (vX.Y.Z) を打つ。念のため既存タグがあれば何もしない。
      - name: Create and push git tag
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "Created and pushed tag ${TAG}"
          fi
