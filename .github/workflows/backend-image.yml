name: Build and push backend image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch: {}

concurrency:
  group: backend-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ubichill/video-player-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract short SHA
        id: versions
        run: echo "short-sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ubichill org 配下の ghcr.io/ubichill/video-player-backend に push するため、
      # このリポジトリ既定の GITHUB_TOKEN（p-nasimonan/* scope）では権限が無い。
      # ubichill org の packages:write 権限を持つ PAT を UBICHILL_GHCR_TOKEN として
      # このリポジトリの Settings > Secrets and variables > Actions に登録すること。
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.UBICHILL_GHCR_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          push: true
          build-args: |
            YTDLP_REFRESH=${{ steps.versions.outputs.short-sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.versions.outputs.short-sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
