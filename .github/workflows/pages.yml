name: Publish mod to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'scripts/verify-dist.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      # SDK 2.1.0 が npm 公開されるまでは、対応HostのローカルSDKで生成・レビュー済みの
      # distを配信する。古い公開SDKで再ビルドしてv3 APIを欠落させないための暫定境界。
      # sourceを変えたpushにdistが含まれない場合は、古いbundleの公開を拒否する。
      - name: Require dist update with source changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          if echo "$changed" | grep -Eq '^(src/|package.json|tsconfig.json)'; then
            echo "$changed" | grep -Eq '^dist/' || {
              echo "src/package changed without a committed dist update"
              exit 1
            }
          fi

      - name: Verify committed mod bundle
        run: node scripts/verify-dist.mjs

      - name: Checkout gh-pages branch (worktree)
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git worktree add /tmp/gh-pages gh-pages 2>/dev/null || {
            git worktree add --detach /tmp/gh-pages
            cd /tmp/gh-pages
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          }

      - name: Sync dist to gh-pages
        run: |
          mkdir -p /tmp/gh-pages/video-player
          cp -r dist/. /tmp/gh-pages/video-player/
          echo "✅ Synced to gh-pages/video-player/"
          ls -la /tmp/gh-pages/video-player/

          # index.json（レジストリ一覧）はサイトルートに置く。acquireMod/ubichill lock は
          # `<baseUrl>/<modId>/mod.json` を期待するため、index.json が video-player/ の
          # 内側にあると baseUrl 計算が二重ネスト（video-player/video-player/...）になる。
          # 古い ubichill CLI は index.json を出力しないため無ければスキップする。
          if [ -f dist/index.json ]; then
            cp dist/index.json /tmp/gh-pages/index.json
            echo "✅ Synced to gh-pages/index.json (registry root)"
          else
            echo "⚠️  dist/index.json が無い（ubichill CLI が古い可能性）。スキップ"
          fi

      - name: Commit and push to gh-pages
        working-directory: /tmp/gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video-player/
          [ -f index.json ] && git add index.json
          if git diff --cached --quiet; then
            echo "No changes to mod bundle, skipping commit"
          else
            git commit -m "chore(mod): update bundle (${GITHUB_SHA::7})"
            git push origin HEAD:gh-pages --force
            echo "✅ Mod published to GitHub Pages"
          fi
